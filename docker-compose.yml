name: ai-online-judge-dev

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ai_judge_nginx_dev
    ports:
      - "80:80"
    depends_on:
      - frontend
      - api-gateway
      - websocket-service
    networks:
      - ai-judge-network
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:15-alpine
    container_name: ai_judge_postgres_dev
    environment:
      POSTGRES_DB: aionlinejudge
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    command: [ "postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30" ]
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./deployments/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U judge -d aionlinejudge" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ai-judge-network
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: ai_judge_redis_dev
    command: redis-server --maxmemory 20mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ai-judge-network
    restart: unless-stopped
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: ai_judge_rabbitmq_dev
    environment:
      RABBITMQ_DEFAULT_USER: judge
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 60s
    networks:
      - ai-judge-network
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.4'

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ai_judge_api_gateway_dev
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://judge:${POSTGRES_PASSWORD:-changeme}@postgres:5432/aionlinejudge?sslmode=disable
      RABBITMQ_URL: amqp://judge:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeyforonlinejudgedev}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ai-judge-network
    restart: unless-stopped
    logging: *default-logging

  judge-worker:
    build:
      context: .
      dockerfile: judge-worker/Dockerfile
    container_name: ai_judge_worker_dev
    environment:
      DATABASE_URL: postgres://judge:${POSTGRES_PASSWORD:-changeme}@postgres:5432/aionlinejudge?sslmode=disable
      RABBITMQ_URL: amqp://judge:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      REDIS_URL: redis:6379
      JUDGE0_URL: ${JUDGE0_URL:-https://ce.judge0.com}
      AST_SERVICE_URL: http://ast-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ai-judge-network
    restart: unless-stopped
    logging: *default-logging

  ast-service:
    build:
      context: .
      dockerfile: ast-service/Dockerfile
    container_name: ai_judge_ast_service_dev
    environment:
      PORT: "8083"
      DATABASE_URL: postgres://judge:${POSTGRES_PASSWORD:-changeme}@postgres:5432/aionlinejudge?sslmode=disable
      AI_TUTOR_URL: http://ai-tutor:8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-judge-network
    restart: unless-stopped
    logging: *default-logging

  ai-tutor:
    build:
      context: ./ai-tutor
      dockerfile: Dockerfile
    container_name: ai_judge_ai_tutor_dev
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://judge:${POSTGRES_PASSWORD:-changeme}@postgres:5432/aionlinejudge
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder-for-testing}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-judge-network
    restart: unless-stopped
    logging: *default-logging

  websocket-service:
    build:
      context: .
      dockerfile: websocket-service/Dockerfile
    container_name: ai_judge_websocket_service_dev
    environment:
      PORT: "8082"
      REDIS_URL: redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeyforonlinejudgedev}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-judge-network
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_judge_frontend_dev
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WS_URL: /ws
    depends_on:
      - api-gateway
      - websocket-service
    networks:
      - ai-judge-network
    restart: unless-stopped
    logging: *default-logging

networks:
  ai-judge-network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  rabbitmq_dev_data:
